name: android

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      architectures:
        description: "ABIs to build, comma separated"
        type: string
        default: arm64-v8a
      no_gms:
        description: "Skip Firebase startup initialisation (devices without Google Play Services)"
        type: boolean
        default: false

concurrency:
  group: android-${{ format('{0}-{1}', github.head_ref || github.run_number, github.job) }}
  cancel-in-progress: true

env:
  MYAPP_VERSION: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # `.yarn/cache` is gitignored, so a fresh checkout downloads every package.
      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install Yarn dependencies
        run: node .yarn/releases/yarn-4.9.4.cjs install --immutable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # sdkmanager is driven directly rather than through
      # android-actions/setup-android, which failed on the runner image. The
      # image already ships build-tools 35.0.0 and platform android-35, but not
      # the NDK and CMake versions this project pins, so those get installed.
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "Using SDK root: $SDK_ROOT"
          ls "$SDK_ROOT"

          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -1 || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"

          if [ ! -w "$SDK_ROOT" ]; then
            echo "::warning::$SDK_ROOT is not writable by $(id -un), taking ownership"
            sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT"
          fi

          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.1.12297006"
          } >> "$GITHUB_ENV"

          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" --install "cmake;3.22.1"

          NDK_VERSION=27.1.12297006
          if ! "$SDKMGR" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION" ||
            [ ! -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]; then
            # sdkmanager has been seen truncating the NDK archive, which then
            # fails with "Error on ZipFile unknown archive". Fall back to the
            # official archive, verified against the checksum published in
            # https://dl.google.com/android/repository/repository2-3.xml
            echo "::warning::sdkmanager could not install the NDK, downloading it directly"
            NDK_ZIP="$RUNNER_TEMP/android-ndk-r27b-linux.zip"
            curl -sSL --retry 5 --retry-delay 3 --retry-all-errors \
              -o "$NDK_ZIP" "https://dl.google.com/android/repository/android-ndk-r27b-linux.zip"
            echo "6fc476b2e57d7c01ac0c95817746b927035b9749  $NDK_ZIP" | sha1sum -c -
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION" "$RUNNER_TEMP/ndk-extract"
            mkdir -p "$RUNNER_TEMP/ndk-extract"
            unzip -q "$NDK_ZIP" -d "$RUNNER_TEMP/ndk-extract"
            mv "$RUNNER_TEMP/ndk-extract/android-ndk-r27b" "$SDK_ROOT/ndk/$NDK_VERSION"
          fi

          echo "--- NDK ---"
          ls "$SDK_ROOT/ndk"
          echo "--- CMake ---"
          ls "$SDK_ROOT/cmake"
          df -h "$SDK_ROOT" | tail -1

          # Fail here rather than inside the Gradle build if a download was truncated.
          test -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" || { echo "::error::NDK $NDK_VERSION install incomplete"; exit 1; }
          test -x "$SDK_ROOT/cmake/3.22.1/bin/ninja" || { echo "::error::CMake 3.22.1 install incomplete"; exit 1; }
          echo "Android SDK components ready"

      # Signing must be prepared before gradle.properties is written, because the
      # keystore path and passwords are referenced there. Repository secrets are
      # used when configured (that is the Google Play key); otherwise a throwaway
      # keystore keeps fork and pull request builds installable - such an APK can
      # never be uploaded to Google Play.
      - name: Prepare release signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            ALIAS="${KEY_ALIAS:-my-key-alias}"
            STORE_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Using keystore from repository secrets (alias: $ALIAS)"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret, generating a throwaway keystore"
            STORE_PASSWORD="$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)"
            ALIAS="ci-release"
            KEY_PASS="$STORE_PASSWORD"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" -storetype PKCS12 \
              -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" \
              -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Discourse Mobile CI, O=Discourse, C=US"
          fi
          {
            echo "keystore=$KEYSTORE"
            echo "alias=$ALIAS"
            echo "store_password=$STORE_PASSWORD"
            echo "key_password=$KEY_PASS"
          } >> "$GITHUB_OUTPUT"

      # `android/gradle.properties` is gitignored (fastlane generates it from CI
      # secrets), so a fresh checkout has no MYAPP_VERSION and no signing config:
      # Gradle cannot even configure the project without it.
      - name: Write android/gradle.properties
        env:
          STORE_FILE: ${{ steps.signing.outputs.keystore }}
          STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          KEY_ALIAS: ${{ steps.signing.outputs.alias }}
          KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        run: |
          cat > android/gradle.properties <<EOF
          MYAPP_VERSION=$MYAPP_VERSION
          MYAPP_RELEASE_STORE_FILE=$STORE_FILE
          MYAPP_RELEASE_STORE_PASSWORD=$STORE_PASSWORD
          MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD

          hermesEnabled=true
          newArchEnabled=true
          android.useAndroidX=true
          android.enableJetifier=true

          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      # Also gitignored. The real Firebase config is used when the secret exists,
      # otherwise a placeholder keeps the build working (push is then unavailable,
      # the app reports and ignores that at runtime).
      - name: Write android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret, writing a placeholder config"
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "discourse-mobile"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.discourse"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildPurposesOnly"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Build release APK
        run: |
          ARGS="-PreactNativeArchitectures=${{ inputs.architectures || 'arm64-v8a' }}"
          if [ "${{ inputs.no_gms }}" = "true" ]; then
            ARGS="$ARGS -PnoGms"
          fi
          cd android
          ./gradlew assembleRelease $ARGS

      - name: Collect APK
        run: |
          SUFFIX=""
          if [ "${{ inputs.no_gms }}" = "true" ]; then
            SUFFIX="-nogms"
          fi
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
            "artifacts/discourse-$MYAPP_VERSION-release$SUFFIX.apk"
          ls -la artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discourse-android-release
          path: artifacts/*.apk
          if-no-files-found: error
